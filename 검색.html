<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한세대학교 인권센터 · 법령/사례 검색</title>
<style>
:root{
  --teal:#4CBABF; --teal-mid:#D7EFF0; --teal-tint:#F1F9FA; --teal-txt:#1F8A90;
  --orange:#FFA645; --orange-tint:#FFEDDA;
  --green:#77BD6D; --green-tint:#F4F9F0;
  --purple:#8E7CC3; --purple-tint:#F1EEF9;
  --rose:#E4707A; --rose-tint:#FBEEEF;
  --ink:#222; --grey:#777; --line:#DDD; --bg:#F7F8F9;
}
*{box-sizing:border-box}
body{margin:0;font-family:"맑은 고딕","Malgun Gothic","Noto Sans KR",sans-serif;
     background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
header{background:var(--teal);color:#fff;padding:18px 24px 20px}
header .wrap{max-width:1180px;margin:0 auto}
header h1{margin:0;font-size:19px;letter-spacing:.5px}
header .sub{font-size:12px;opacity:.92;margin-top:3px}
.searchbar{max-width:1180px;margin:14px auto 0;display:flex;gap:8px}
.searchbar input{flex:1;padding:13px 16px;font-size:16px;border:0;border-radius:6px;outline:none}
.searchbar button{padding:0 26px;font-size:15px;font-weight:700;border:0;border-radius:6px;
     background:#fff;color:var(--teal-txt);cursor:pointer}
.searchbar button:hover{background:#EAFAFB}
.chips{max-width:1180px;margin:9px auto 0;display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:rgba(255,255,255,.22);color:#fff;font-size:12px;padding:3px 10px;
     border-radius:12px;cursor:pointer}
.chips span:hover{background:rgba(255,255,255,.38)}
main{max-width:1180px;margin:18px auto 60px;padding:0 16px;display:grid;
     grid-template-columns:222px 1fr;gap:18px}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px}
.panel h3{margin:0 0 8px;font-size:13px;color:var(--teal-txt);letter-spacing:.5px}
.panel h3:not(:first-child){margin-top:16px}
label.f{display:flex;align-items:center;gap:7px;font-size:13px;padding:3px 0;cursor:pointer}
label.f .cnt{margin-left:auto;color:var(--grey);font-size:11px}
.tagbox{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;padding:3px 9px;border-radius:11px;background:#EFEFEF;color:#444;
     cursor:pointer;border:1px solid transparent}
.tag.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.toolbar .n{font-size:13px;color:var(--grey)}
.toolbar .n b{color:var(--teal-txt);font-size:15px}
.toolbar select,.toolbar button{font-size:12.5px;padding:5px 10px;border:1px solid var(--line);
     border-radius:5px;background:#fff;cursor:pointer}
.toolbar button:hover{background:#F0FAFB}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-bottom:9px}
.card:hover{border-color:var(--teal)}
.card .top{display:flex;align-items:flex-start;gap:8px}
.card input[type=checkbox]{margin-top:5px}
.badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:4px;white-space:nowrap}
.b-학내규정{background:var(--teal-tint);color:var(--teal-txt);border:1px solid var(--teal)}
.b-법령{background:var(--green-tint);color:#3D7A34;border:1px solid var(--green)}
.b-판례{background:var(--orange-tint);color:#B45309;border:1px solid var(--orange)}
.b-헌재결정례{background:var(--rose-tint);color:#B03B46;border:1px solid var(--rose)}
.b-인권위결정례{background:var(--purple-tint);color:#5B4B96;border:1px solid var(--purple)}
.b-법령해석례,.b-행정심판례,.b-기타{background:#EEE;color:#555;border:1px solid #BBB}
.card .ttl{font-size:15px;font-weight:700;line-height:1.45;flex:1}
.card .meta{font-size:11.5px;color:var(--grey);margin:3px 0 6px}
.card .snip{font-size:13px;color:#333;background:#FAFAFA;border-left:3px solid var(--teal-mid);
     padding:7px 10px;border-radius:0 4px 4px 0}
.card .full{display:none;font-size:13px;margin-top:8px;padding:9px 11px;background:#FCFCFC;
     border:1px solid #EEE;border-radius:4px;white-space:pre-wrap;line-height:1.75}
.card.open .full{display:block}
.card .foot{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.card .foot a,.card .foot button{font-size:11.5px;padding:3px 9px;border:1px solid var(--line);
     border-radius:4px;background:#fff;color:#444;text-decoration:none;cursor:pointer}
.card .foot a:hover,.card .foot button:hover{background:#F0FAFB;border-color:var(--teal)}
.card .foot .t{font-size:11px;color:#666;background:#F1F1F1;border-radius:10px;padding:2px 8px;cursor:pointer}
mark{background:#FFF07A;padding:0 1px;border-radius:2px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:8px;padding:36px 20px;
     text-align:center;color:var(--grey)}
.note{background:#FFFBEA;border:1px solid #F5DFA0;border-radius:6px;padding:10px 13px;
     font-size:12.5px;margin-bottom:12px;line-height:1.7}
footer{max-width:1180px;margin:0 auto 40px;padding:0 16px;font-size:11.5px;color:var(--grey)}
@media(max-width:820px){main{grid-template-columns:1fr}}
@media print{header,.panel,.toolbar,.chips,.card .foot,.searchbar{display:none!important}
  main{grid-template-columns:1fr;margin:0}.card{break-inside:avoid;border:0;border-bottom:1px solid #ccc}
  .card .full{display:block}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>한세대학교 인권센터 &nbsp;·&nbsp; 법령 · 사례 검색</h1>
    <div class="sub">학내 규정 · 관련 법령 · 판례 · 헌재결정례 · 국가인권위원회 결정례를 한 번에 검색합니다</div>
  </div>
  <div class="searchbar">
    <input id="q" type="text" placeholder="예) 지도교수 인건비   /   임시조치 분리   /   제척 기피   /   비실명 대리신고" autofocus>
    <button onclick="run()">검색</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <aside class="panel">
    <h3>자료 구분</h3>
    <div id="srcbox"></div>
    <h3>주제 태그</h3>
    <div class="tagbox" id="tagbox"></div>
    <h3>검색 옵션</h3>
    <label class="f"><input type="checkbox" id="orMode"> 하나라도 포함(OR)</label>
    <label class="f"><input type="checkbox" id="synOn" checked> 동의어 함께 찾기</label>
  </aside>

  <section>
    <div id="warn"></div>
    <div class="toolbar">
      <span class="n">검색 결과 <b id="cnt">0</b>건</span>
      <select id="sort" onchange="render()">
        <option value="score">관련도순</option>
        <option value="date">최신순</option>
        <option value="src">자료구분순</option>
      </select>
      <button onclick="selAll(true)">전체 선택</button>
      <button onclick="selAll(false)">선택 해제</button>
      <button onclick="copySel()">선택 항목 복사</button>
      <button onclick="window.print()">인쇄 / PDF 저장</button>
      <button onclick="reset()">초기화</button>
    </div>
    <div id="out"></div>
  </section>
</main>

<footer id="foot"></footer>

<script src="data/data_rules.js"></script>
<script src="data/data_laws.js"></script>
<script src="data/data_api.js"></script>
<script src="data/synonyms.js"></script>
<script>
/* ══════════ 데이터 로드 ══════════ */
var DB = []
  .concat(window.DATA_RULES || [])
  .concat(window.DATA_LAWS  || [])
  .concat(window.DATA_API   || []);

/* ══════════ 정규화 : 공백·대소문자 무시 ══════════ */
function norm(s){ return (s||'').toString().toLowerCase().replace(/\s+/g,''); }
DB.forEach(function(d){
  d.tags = d.tags || [];
  d._t = norm(d.title) + norm(d.ref||'');
  d._g = norm(d.tags.join(''));
  d._b = norm(d.body);
});

/* ══════════ 동의어 확장 ══════════ */
var SYN = (window.SYNONYMS||[]).map(function(g){ return g.map(norm); });
var JOSA = ['을','를','이','가','은','는','에','의','도','로','와','과','만','께','서'];
var JOSA2 = ['으로','에서','에게','부터','까지','으로써','에서의','이나','라도'];

function variants(tok){
  var v = [tok];
  JOSA2.forEach(function(j){ if(tok.length>j.length+1 && tok.endsWith(j)) v.push(tok.slice(0,-j.length)); });
  JOSA.forEach(function(j){ if(tok.length>2 && tok.endsWith(j)) v.push(tok.slice(0,-1)); });
  return v;
}
function expand(tok){
  var base = variants(tok), out = base.slice();
  if(document.getElementById('synOn').checked){
    base.forEach(function(b){
      SYN.forEach(function(g){
        if(g.indexOf(b) >= 0)
          g.forEach(function(w){ if(out.indexOf(w)<0) out.push(w); });
      });
    });
  }
  return out.filter(function(x){ return x.length>0; });
}

/* ══════════ 하이라이트 (공백이 끼어 있어도 인식) ══════════ */
function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function hlRe(tok){
  return new RegExp(tok.split('').map(esc).join('\\s*'), 'gi');
}
function highlight(text, toks){
  var out = text.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});
  toks.forEach(function(t){ if(t.length>0) out = out.replace(hlRe(t), function(m){ return '<mark>'+m+'</mark>'; }); });
  return out;
}

/* ══════════ 검색 ══════════ */
var state = {q:'', srcs:{}, tags:{}, results:[]};

function score(d, groups, orMode){
  var s = 0, hit = 0;
  groups.forEach(function(alts){
    var g = 0;
    alts.forEach(function(a){
      if(!a) return;
      var n;
      n = d._t.split(a).length-1; if(n) g += Math.min(n,3)*9;
      n = d._g.split(a).length-1; if(n) g += Math.min(n,3)*6;
      n = d._b.split(a).length-1; if(n) g += Math.min(n,10)*2;
    });
    if(g>0){ hit++; s += g; }
  });
  if(orMode ? hit===0 : hit<groups.length) return 0;
  return s;
}

function run(){
  state.q = document.getElementById('q').value.trim();
  var raw = state.q.split(/\s+/).filter(Boolean).map(norm).filter(Boolean);
  var orMode = document.getElementById('orMode').checked;
  var groups = raw.map(expand);

  var res = DB.filter(function(d){
    if(state.srcs[d.src]===false) return false;
    var actTags = Object.keys(state.tags).filter(function(k){ return state.tags[k]; });
    if(actTags.length && !actTags.every(function(t){ return d.tags.indexOf(t)>=0; })) return false;
    return true;
  });

  if(groups.length){
    res = res.map(function(d){ return {d:d, s:score(d, groups, orMode)}; })
             .filter(function(x){ return x.s>0; });
  } else {
    res = res.map(function(d){ return {d:d, s:0}; });
  }
  state.results = res;
  state.toks = [];
  groups.forEach(function(g){ g.forEach(function(t){ if(state.toks.indexOf(t)<0) state.toks.push(t); }); });
  render();
}

function snippet(body, toks){
  var pos = -1;
  for(var i=0;i<toks.length;i++){
    var m = hlRe(toks[i]).exec(body);
    if(m && (pos<0 || m.index<pos)) pos = m.index;
  }
  if(pos<0) return body.slice(0,190) + (body.length>190?' …':'');
  var st = Math.max(0, pos-70), en = Math.min(body.length, pos+220);
  return (st>0?'… ':'') + body.slice(st,en) + (en<body.length?' …':'');
}

function render(){
  var sort = document.getElementById('sort').value;
  var arr = state.results.slice();
  if(sort==='score') arr.sort(function(a,b){ return b.s-a.s; });
  if(sort==='date')  arr.sort(function(a,b){ return (b.d.date||'').localeCompare(a.d.date||''); });
  if(sort==='src')   arr.sort(function(a,b){ return (a.d.src+a.d.id).localeCompare(b.d.src+b.d.id); });

  document.getElementById('cnt').textContent = arr.length;
  var out = document.getElementById('out');
  if(!arr.length){
    out.innerHTML = '<div class="empty">검색 결과가 없습니다.<br><br>'
      + '· 단어를 줄여서 다시 검색해 보세요 (예: “지도교수 인건비 반납” → “인건비”)<br>'
      + '· 왼쪽에서 <b>하나라도 포함(OR)</b>을 켜면 결과가 넓어집니다<br>'
      + '· 자료 구분·태그 필터가 켜져 있는지 확인하세요</div>';
    return;
  }
  var html = arr.slice(0,300).map(function(x,i){
    var d = x.d;
    var body = d.body || '';
    return '<div class="card" id="c'+i+'">'
      + '<div class="top"><input type="checkbox" class="sel" data-i="'+i+'">'
      + '<span class="badge b-'+d.src+'">'+d.src+'</span>'
      + '<span class="ttl">'+highlight(d.title, state.toks)+'</span></div>'
      + '<div class="meta">'+[d.cat,d.ref,d.chapter,d.date].filter(Boolean).join(' · ')
      + (d.note? ' · <span style="color:#B45309">'+d.note+'</span>':'') + '</div>'
      + '<div class="snip">'+highlight(snippet(body, state.toks), state.toks)+'</div>'
      + '<div class="full">'+highlight(body, state.toks)+'</div>'
      + '<div class="foot">'
      + '<button onclick="document.getElementById(\'c'+i+'\').classList.toggle(\'open\')">전문 보기</button>'
      + (d.url? '<a href="'+d.url+'" target="_blank">원문 열기</a>':'')
      + '<button onclick="copyOne('+i+')">이 항목 복사</button>'
      + d.tags.map(function(t){ return '<span class="t" onclick="toggleTag(\''+t+'\')">#'+t+'</span>'; }).join('')
      + '</div></div>';
  }).join('');
  if(arr.length>300) html += '<div class="empty">결과가 많습니다. 상위 300건만 표시했습니다. 검색어를 구체적으로 입력해 주세요.</div>';
  out.innerHTML = html;
  window._arr = arr;
}

/* ══════════ 필터 UI ══════════ */
function buildFilters(){
  var srcCnt = {}, tagCnt = {};
  DB.forEach(function(d){
    srcCnt[d.src] = (srcCnt[d.src]||0)+1;
    d.tags.forEach(function(t){ tagCnt[t] = (tagCnt[t]||0)+1; });
  });
  var order = ['학내규정','법령','판례','헌재결정례','인권위결정례','법령해석례','행정심판례','기타'];
  var keys = Object.keys(srcCnt).sort(function(a,b){
    var ia=order.indexOf(a), ib=order.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  document.getElementById('srcbox').innerHTML = keys.map(function(k){
    return '<label class="f"><input type="checkbox" checked onchange="state.srcs[\''+k+'\']=this.checked;run()">'
         + '<span class="badge b-'+k+'">'+k+'</span><span class="cnt">'+srcCnt[k]+'</span></label>';
  }).join('');
  keys.forEach(function(k){ state.srcs[k]=true; });

  var tags = Object.keys(tagCnt).sort(function(a,b){ return tagCnt[b]-tagCnt[a]; }).slice(0,28);
  document.getElementById('tagbox').innerHTML = tags.map(function(t){
    return '<span class="tag" id="tg_'+encodeURIComponent(t)+'" onclick="toggleTag(\''+t+'\')">'+t+'</span>';
  }).join('');

  var ex = ['제척 기피','임시조치 분리','처리기한','비실명 대리신고','2차 피해','지도교수',
            '불이익조치','성희롱 정의','위원 명단 공개','징계 가중','디지털성폭력','개인정보 동의'];
  document.getElementById('chips').innerHTML =
    '<span style="background:none;cursor:default;opacity:.85">자주 찾는 키워드 :</span>'
    + ex.map(function(k){ return '<span onclick="quick(\''+k+'\')">'+k+'</span>'; }).join('');

  var api = (window.DATA_API||[]).length;
  document.getElementById('warn').innerHTML = api ? '' :
    '<div class="note"><b>판례 · 헌재결정례 · 인권위 결정례가 아직 없습니다.</b><br>'
    + '함께 들어 있는 <b>수집기.py</b> 를 한 번 실행하면 국가법령정보 OPEN API에서 자료를 받아와 '
    + '이 화면에 함께 검색됩니다. 자세한 방법은 <b>사용설명서</b>를 참고하세요.<br>'
    + '지금은 <b>학내 규정 89개 조문</b>과 <b>관련 법령 29개 조문</b>을 검색할 수 있습니다.</div>';

  document.getElementById('foot').innerHTML =
    '수록 자료 : ' + keys.map(function(k){ return k+' '+srcCnt[k]+'건'; }).join(' / ')
    + ' &nbsp;|&nbsp; 총 ' + DB.length + '건'
    + '<br>※ 법령 요지는 참고용입니다. 인용 전 국가법령정보센터(law.go.kr)에서 원문과 최신 개정 여부를 반드시 확인하세요.'
    + '<br>※ 이 프로그램은 공개 자료만 다룹니다. 학내 사건 기록(민감정보)은 입력하지 마세요.';
}

function toggleTag(t){
  state.tags[t] = !state.tags[t];
  var el = document.getElementById('tg_'+encodeURIComponent(t));
  if(el) el.classList.toggle('on', !!state.tags[t]);
  run();
}
function quick(k){ document.getElementById('q').value = k; run(); }
function reset(){
  document.getElementById('q').value='';
  state.tags={}; document.querySelectorAll('.tag').forEach(function(e){e.classList.remove('on');});
  document.querySelectorAll('#srcbox input').forEach(function(e){e.checked=true;});
  Object.keys(state.srcs).forEach(function(k){state.srcs[k]=true;});
  run();
}
function selAll(v){ document.querySelectorAll('.sel').forEach(function(e){ e.checked=v; }); }

function asText(d){
  return '【'+d.src+'】 '+d.title+'\n'
       + [d.cat,d.ref,d.date].filter(Boolean).join(' · ') + '\n'
       + (d.body||'') + '\n'
       + (d.url? '원문: '+d.url+'\n':'')
       + '────────────────────────────\n';
}
function copyText(t){
  var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); alert('복사했습니다. 한글·워드에 붙여넣기 하세요.'); }
  catch(e){ alert('복사에 실패했습니다. 내용을 직접 선택해 복사해 주세요.'); }
  document.body.removeChild(ta);
}
function copyOne(i){ copyText(asText(window._arr[i].d)); }
function copySel(){
  var idx=[]; document.querySelectorAll('.sel').forEach(function(e){ if(e.checked) idx.push(+e.dataset.i); });
  if(!idx.length){ alert('복사할 항목을 먼저 체크해 주세요.'); return; }
  var head = '［인권센터 검색 결과］ 검색어: '+(state.q||'(전체)')+'   '+idx.length+'건\n'
           + '════════════════════════════\n';
  copyText(head + idx.map(function(i){ return asText(window._arr[i].d); }).join(''));
}

document.getElementById('q').addEventListener('keydown', function(e){ if(e.key==='Enter') run(); });
buildFilters();
// 주소창에 ?q=검색어 를 붙이면 바로 검색됩니다 (즐겨찾기용)
var _m = location.search.match(/[?&]q=([^&]*)/);
if(_m){ try{ document.getElementById('q').value = decodeURIComponent(_m[1]); }catch(e){} }
run();
</script>
</body>
</html>
